// JarJar's metadata uses compatibility ranges, while the original Voxy build packages the
// explicitly selected library versions. Keep the payload filenames aligned with the pinned
// metadata paths and replace only RocksDB with the architecture-trimmed copy below.
def jarJarPayload = configurations.detachedConfiguration(
        dependencies.create('org.lwjgl:lwjgl-zstd:3.3.1'),
        dependencies.create('org.lwjgl:lwjgl-lmdb:3.3.1'),
        dependencies.create('org.rocksdb:rocksdbjni:10.2.1'),
        dependencies.create('org.lz4:lz4-java:1.8.0'),
        dependencies.create('redis.clients:jedis:5.1.0'),
        dependencies.create('org.apache.commons:commons-pool2:2.12.0'))
jarJarPayload.transitive = false

def rocksDbJarJarFiles = jarJarPayload.incoming.artifacts.artifactFiles.filter {
    it.name.startsWith('rocksdbjni-')
}

def makeExcludedRocksDB = tasks.register('makeExcludedRocksDB', Zip) {
    archiveExtension.set('jar')
    entryCompression = ZipEntryCompression.STORED
    destinationDirectory.set(layout.buildDirectory.dir('trimmed-dependencies'))

    dependsOn rocksDbJarJarFiles
    from { zipTree(rocksDbJarJarFiles.singleFile) }
    archiveFileName.set(providers.provider { rocksDbJarJarFiles.singleFile.name })

    exclude {
        def file = it.name
        if (file.endsWith('.jnilib')) {
            return true
        }
        if (!file.endsWith('.so')) {
            return false
        }
        return ['osx', 'linux32', 'musl', 's390x', 'riscv64', 'ppc64le', 'aarch64'].any(file::contains)
    }
}

test {
    useJUnitPlatform {
        excludeTags 'bobby-exact-artifact', 'compat-real-data', 'redis-real-backend', 'round6-performance'
    }
}

tasks.register('round6PerformanceTest', Test) {
    description = 'Runs the non-gating Forxy round-six allocation and contention benchmark harness.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'round6-performance'
    }
    testLogging {
        showStandardStreams = true
    }
}

tasks.register('redisRealBackendTest', Test) {
    description = 'Verifies paged position iteration and restart against a real Redis service.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'redis-real-backend'
    }
    def redisTestPort = (project.findProperty('voxyRedisTestPort') ?: '').toString().trim()
    if (!redisTestPort.isEmpty()) {
        systemProperty 'voxyRedisTestPort', redisTestPort
    }
    doFirst {
        if (redisTestPort.isEmpty()) {
            throw new GradleException('redisRealBackendTest requires -PvoxyRedisTestPort=<port>')
        }
    }
}

tasks.register('bobbyExactArtifactTest', Test) {
    description = 'Verifies the exact Bobby Reforged 1.20.1-5.0.1 artifact and Voxy unload contract.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'bobby-exact-artifact'
    }
    if (!bobbyDevJarPath.isEmpty()) {
        systemProperty 'voxyBobbyDevJar', file(bobbyDevJarPath).absolutePath
    }
    doFirst {
        if (bobbyDevJarPath.isEmpty()) {
            throw new GradleException('bobbyExactArtifactTest requires -PvoxyBobbyDevJar=<bobby-1.20.1_v5.0.1.jar>')
        }
        if (!file(bobbyDevJarPath).isFile()) {
            throw new GradleException("Bobby Reforged dev jar does not exist: ${file(bobbyDevJarPath)}")
        }
    }
}

tasks.register('compatRealDataTest', Test) {
    description = 'Decodes real Bobby Reforged region data and a real Distant Horizons database.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'compat-real-data'
    }
    [
            voxyBobbyDevJar: bobbyDevJarPath,
            voxyBobbyCacheTestPath: bobbyCacheTestPath,
            voxyDistantHorizonsDevJar: distantHorizonsDevJarPath,
            voxyDhDatabaseTestPath: distantHorizonsDatabaseTestPath
    ].each { name, configuredPath ->
        if (!configuredPath.isEmpty()) {
            systemProperty name, file(configuredPath).absolutePath
        }
    }
    doFirst {
        [
                voxyBobbyDevJar: bobbyDevJarPath,
                voxyBobbyCacheTestPath: bobbyCacheTestPath,
                voxyDistantHorizonsDevJar: distantHorizonsDevJarPath,
                voxyDhDatabaseTestPath: distantHorizonsDatabaseTestPath
        ].each { name, configuredPath ->
            if (configuredPath.isEmpty()) {
                throw new GradleException("compatRealDataTest requires -P${name}=<path>")
            }
            if (!file(configuredPath).exists()) {
                throw new GradleException("${name} does not exist: ${file(configuredPath)}")
            }
        }
    }
}

// Forge Jar-in-Jar identifies classifier siblings by the same group/name, so native entries
// would collide with their class jars. Preserve official native resource paths in the outer jar.
tasks.named('jarJar') {
    finalizedBy('reobfJarJar')
    if (!INCLUDE_OTHER_ARCHS) {
        dependsOn(makeExcludedRocksDB)
        getIncludedDependencies().setFrom(
                jarJarPayload.filter { !it.name.startsWith('rocksdbjni-') },
                makeExcludedRocksDB.flatMap { it.archiveFile })
    }
    from({ project.configurations.zstdJarJarNative.collect { zipTree(it) } }) {
        include 'windows/**'
        include 'linux/**'
    }
    from({ project.configurations.lmdbJarJarNative.collect { zipTree(it) } }) {
        include 'windows/**'
        include 'linux/**'
    }
}

tasks.named('jar', Jar) {
    dependsOn(relocateXz)
    from({ zipTree(relocateXz.get().archiveFile.get().asFile) })
}

tasks.named('jarJar', Jar) {
    dependsOn(relocateXz)
    from({ zipTree(relocateXz.get().archiveFile.get().asFile) })
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            forge_version          : project.forge_version,
            forge_version_range    : project.forge_version_range,
            loader_version_range   : project.loader_version_range,
            embeddium_version_range: project.embeddium_version_range,
            oculus_version_range   : project.oculus_version_range,
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_license            : project.mod_license,
            mod_version            : project.mod_version,
            mod_authors            : project.mod_authors,
            mod_description        : project.mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : project.mod_id,
                'Specification-Vendor'    : project.mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.mod_name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : project.mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'voxy.forge.mixins.json'
        ])
    }
}

jar.finalizedBy('reobfJar')
