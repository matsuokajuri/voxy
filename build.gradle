mixin {
    add sourceSets.main, 'voxy.forge.refmap.json'
    config 'voxy.forge.mixins.json'
    quiet
}

def INCLUDE_OTHER_ARCHS = "true".equalsIgnoreCase(project.findProperty("includeOtherArchs") as String)

jarJar.enable()

configurations {
    zstdJarJarNative
    lmdbJarJarNative
    xzRelocation
}

def relocateXz = tasks.register(
        'relocateXz',
        com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    description = 'Relocates XZ so Distant Horizons and Voxy do not export the same Java module package.'
    archiveBaseName.set('voxy-xz')
    archiveVersion.set('1.10')
    archiveClassifier.set('relocated')
    destinationDirectory.set(layout.buildDirectory.dir('relocated-dependencies'))
    configurations = [project.configurations.xzRelocation]
    relocate 'org.tukaani.xz', 'me.cortex.voxy.dependency.xz'
    exclude 'META-INF/**'
}

// MixinGradle attaches an addMixins task to every Jar task. This archive is only a
// relocated third-party dependency and has no mixin metadata; letting it participate
// would create compileJava -> relocateXz -> addMixinsToRelocateXz -> compileJava.
afterEvaluate {
    relocateXz.configure {
        setDependsOn(dependsOn.findAll { dependency ->
            !(dependency instanceof TaskProvider && dependency.name == 'addMixinsToRelocateXz') &&
                    !(dependency instanceof Task && dependency.name == 'addMixinsToRelocateXz') &&
                    dependency.toString() != 'addMixinsToRelocateXz'
        })
    }
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                voxy {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', project.mod_id
            def quickPlayServer = (project.findProperty('voxyQuickPlayServer') ?: '').toString().trim()
            if (!quickPlayServer.isEmpty()) {
                args '--quickPlayMultiplayer', quickPlayServer
            } else {
                def quickPlayWorld = (project.findProperty('voxyQuickPlayWorld') ?: '新的世界').toString()
                args '--quickPlaySingleplayer', quickPlayWorld
            }
            if (project.hasProperty('voxyRenderdocCompat')) {
                property 'voxy.forge.renderdocCompatGeometryBuffer', 'true'
            }
            if (project.hasProperty('voxyAuditRound6Performance')) {
                property 'voxy.forge.auditRound6Performance', 'true'
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', project.mod_id
            args '--nogui'
        }
    }
}

repositories {
    mavenCentral()
    flatDir {
        dirs 'dev-mods'
        ['voxyEmbeddiumDevJar', 'voxyOculusDevJar', 'voxyAcediumDevJar', 'voxyVivecraftDevJar', 'voxyBobbyDevJar', 'voxyChunkyDevJar', 'voxyDistantHorizonsDevJar'].each { propertyName ->
            def configuredPath = (project.findProperty(propertyName) ?: '').toString().trim()
            if (!configuredPath.isEmpty()) {
                dirs file(configuredPath).parentFile
            }
        }
    }
}

def flatDirDependencyNotation = { File jarFile ->
    def baseName = jarFile.name.replaceFirst(/\.jar$/, '')
    def split = baseName.lastIndexOf('-')
    if (split <= 0 || split == baseName.length() - 1) {
        throw new GradleException("Frontend dev jar name must be name-version.jar: ${jarFile}")
    }
    return "voxyDev:${baseName.substring(0, split)}:${baseName.substring(split + 1)}"
}

def optionalFrontendJars = { propertyName, includePattern ->
    def configuredPath = (project.findProperty(propertyName) ?: '').toString().trim()
    if (!configuredPath.isEmpty()) {
        return [flatDirDependencyNotation(file(configuredPath))]
    }

    return fileTree(dir: 'dev-mods', include: includePattern).files.collect { flatDirDependencyNotation(it) }
}

