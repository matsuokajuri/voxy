plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

sourceSets {
    main {
        java {
            include 'me/cortex/voxy/forge/**'
            include 'me/cortex/voxy/platform/**'
            include 'me/cortex/voxy/config/**'
            include 'me/cortex/voxy/common/util/Pair.java'
            include 'me/cortex/voxy/common/util/GlobalCleaner.java'
            include 'me/cortex/voxy/common/util/ByteBufferBackedInputStream.java'
            include 'me/cortex/voxy/common/util/AllocationArena.java'
            include 'me/cortex/voxy/common/util/HierarchicalBitSet.java'
            include 'me/cortex/voxy/common/util/TrackedObject.java'
            include 'me/cortex/voxy/common/util/UnsafeUtil.java'
            include 'me/cortex/voxy/common/util/MemoryBuffer.java'
            include 'me/cortex/voxy/common/util/ThreadLocalMemoryBuffer.java'
            include 'me/cortex/voxy/common/util/ResizingThreadLocalMemoryBuffer.java'
            include 'me/cortex/voxy/common/Logger.java'
            include 'me/cortex/voxy/common/thread/**'
            include 'me/cortex/voxy/client/compat/SemaphoreBlockImpersonator.java'
            include 'me/cortex/voxy/common/voxelization/VoxelizedSection.java'
            include 'me/cortex/voxy/common/voxelization/ILightingSupplier.java'
            include 'me/cortex/voxy/common/voxelization/WorldConversionFactory.java'
            include 'me/cortex/voxy/common/voxelization/WorldVoxilizedSectionMipper.java'
            include 'me/cortex/voxy/common/world/WorldSection.java'
            include 'me/cortex/voxy/common/world/ActiveSectionTracker.java'
            include 'me/cortex/voxy/common/world/WorldEngine.java'
            include 'me/cortex/voxy/common/world/WorldUpdater.java'
            include 'me/cortex/voxy/common/world/SaveLoadSystem3.java'
            include 'me/cortex/voxy/common/world/other/Mapper.java'
            include 'me/cortex/voxy/common/world/other/Mipper.java'
            include 'me/cortex/voxy/common/world/service/SectionSavingService.java'
            include 'me/cortex/voxy/common/world/service/VoxelIngestService.java'
            include 'me/cortex/voxy/common/config/IMappingStorage.java'
            include 'me/cortex/voxy/common/config/IStoredSectionPositionIterator.java'
            include 'me/cortex/voxy/common/config/ConfigBuildCtx.java'
            include 'me/cortex/voxy/common/config/section/SectionStorage.java'
            include 'me/cortex/voxy/common/config/section/SectionSerializationStorage.java'
            include 'me/cortex/voxy/common/config/storage/StorageBackend.java'
            include 'me/cortex/voxy/common/config/storage/inmemory/MemoryStorageBackend.java'
            include 'me/cortex/voxy/common/config/storage/lmdb/Cursor.java'
            include 'me/cortex/voxy/common/config/storage/lmdb/LMDBInterface.java'
            include 'me/cortex/voxy/common/config/storage/lmdb/TransactionCallback.java'
            include 'me/cortex/voxy/common/config/storage/lmdb/TransactionWrappedCallback.java'
            include 'me/cortex/voxy/common/config/storage/lmdb/TransactionWrapper.java'
            include 'me/cortex/voxy/common/config/compressors/StorageCompressor.java'
        }
        resources {
            include 'META-INF/MANIFEST.MF'
            include 'META-INF/accesstransformer.cfg'
            include 'META-INF/mods.toml'
            include 'voxy.forge.mixins.json'
            include 'pack.mcmeta'
            include 'assets/voxy/shaders/**'
        }
    }
}

jarJar.enable()

configurations {
    zstdJarJarNative
    lmdbJarJarNative
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                voxy {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', project.mod_id
            def quickPlayWorld = (project.findProperty('voxyQuickPlayWorld') ?: '新的世界').toString()
            args '--quickPlaySingleplayer', quickPlayWorld
            if (project.hasProperty('voxyAuditChunkBound')) {
                property 'voxy.forge.auditChunkBound', 'true'
            }
            if (project.hasProperty('voxyAuditShaderpack')) {
                property 'voxy.forge.auditShaderpack', 'true'
            }
            if (project.hasProperty('voxyForceNormalTerrainShaders')) {
                property 'voxy.forge.forceNormalTerrainShaders', 'true'
            }
            if (project.hasProperty('voxyAuditSourceDepth')) {
                property 'voxy.forge.auditSourceDepth', 'true'
            }
            if (project.hasProperty('voxyAuditLighting')) {
                property 'voxy.forge.auditLighting', 'true'
            }
            if (project.hasProperty('voxySkipVanillaDepthFeedback')) {
                property 'voxy.forge.skipVanillaDepthFeedback', 'true'
            }
            if (project.hasProperty('voxyRenderdocCompat')) {
                property 'voxy.forge.renderdocCompatGeometryBuffer', 'true'
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', project.mod_id
            args '--nogui'
        }
    }
}

repositories {
    mavenCentral()
    flatDir {
        dirs 'dev-mods'
        ['voxyEmbeddiumDevJar', 'voxyOculusDevJar'].each { propertyName ->
            def configuredPath = (project.findProperty(propertyName) ?: '').toString().trim()
            if (!configuredPath.isEmpty()) {
                dirs file(configuredPath).parentFile
            }
        }
    }
}

def flatDirDependencyNotation = { File jarFile ->
    def baseName = jarFile.name.replaceFirst(/\.jar$/, '')
    def split = baseName.lastIndexOf('-')
    if (split <= 0 || split == baseName.length() - 1) {
        throw new GradleException("Frontend dev jar name must be name-version.jar: ${jarFile}")
    }
    return "voxyDev:${baseName.substring(0, split)}:${baseName.substring(split + 1)}"
}

def optionalFrontendJars = { propertyName, includePattern ->
    def configuredPath = (project.findProperty(propertyName) ?: '').toString().trim()
    if (!configuredPath.isEmpty()) {
        return [flatDirDependencyNotation(file(configuredPath))]
    }

    return fileTree(dir: 'dev-mods', include: includePattern).files.collect { flatDirDependencyNotation(it) }
}

def embeddiumDevJars = optionalFrontendJars('voxyEmbeddiumDevJar', 'embeddium*.jar')
def oculusDevJars = optionalFrontendJars('voxyOculusDevJar', 'oculus*.jar')

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    implementation "it.unimi.dsi:fastutil:${project.fastutil_version}"
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    minecraftLibrary("org.lwjgl:lwjgl-zstd:3.3.1") {
        transitive = false
    }
    minecraftLibrary("org.lwjgl:lwjgl-zstd:3.3.1:natives-windows") {
        transitive = false
    }
    minecraftLibrary("org.lwjgl:lwjgl-lmdb:3.3.1") {
        transitive = false
    }
    minecraftLibrary("org.lwjgl:lwjgl-lmdb:3.3.1:natives-windows") {
        transitive = false
    }
    minecraftLibrary("org.rocksdb:rocksdbjni:10.2.1") {
        transitive = false
    }
    minecraftLibrary("org.lz4:lz4-java:1.8.0") {
        transitive = false
    }
    minecraftLibrary("redis.clients:jedis:5.1.0") {
        transitive = false
    }
    minecraftLibrary("org.apache.commons:commons-pool2:2.12.0") {
        transitive = false
    }
    zstdJarJarNative("org.lwjgl:lwjgl-zstd:3.3.1:natives-windows") {
        transitive = false
    }
    zstdJarJarNative("org.lwjgl:lwjgl-zstd:3.3.1:natives-linux") {
        transitive = false
    }
    lmdbJarJarNative("org.lwjgl:lwjgl-lmdb:3.3.1:natives-windows") {
        transitive = false
    }
    lmdbJarJarNative("org.lwjgl:lwjgl-lmdb:3.3.1:natives-linux") {
        transitive = false
    }
    jarJar(group: 'org.lwjgl', name: 'lwjgl-zstd', version: '[3.3.1,3.4)') {
        transitive = false
        jarJar.pin(it, '3.3.1')
    }
    jarJar(group: 'org.lwjgl', name: 'lwjgl-lmdb', version: '[3.3.1,3.4)') {
        transitive = false
        jarJar.pin(it, '3.3.1')
    }
    jarJar(group: 'org.rocksdb', name: 'rocksdbjni', version: '[10.2.1,10.3)') {
        transitive = false
        jarJar.pin(it, '10.2.1')
    }
    jarJar(group: 'org.lz4', name: 'lz4-java', version: '[1.8.0,1.9)') {
        transitive = false
        jarJar.pin(it, '1.8.0')
    }
    jarJar(group: 'redis.clients', name: 'jedis', version: '[5.1.0,5.2)') {
        transitive = false
        jarJar.pin(it, '5.1.0')
    }
    jarJar(group: 'org.apache.commons', name: 'commons-pool2', version: '[2.12.0,2.13)') {
        transitive = false
        jarJar.pin(it, '2.12.0')
    }

    for (def embeddiumDevJar : embeddiumDevJars) {
        compileOnly fg.deobf(embeddiumDevJar)
        runtimeOnly fg.deobf(embeddiumDevJar)
    }

    for (def oculusDevJar : oculusDevJars) {
        compileOnly fg.deobf(oculusDevJar)
        runtimeOnly fg.deobf(oculusDevJar)
    }
}

test {
    useJUnitPlatform()
}

// Forge Jar-in-Jar identifies classifier siblings by the same group/name, so native entries
// would collide with their class jars. Preserve official native resource paths in the outer jar.
tasks.named('jarJar') {
    from({ project.configurations.zstdJarJarNative.collect { zipTree(it) } }) {
        include 'windows/**'
        include 'linux/**'
    }
    from({ project.configurations.lmdbJarJarNative.collect { zipTree(it) } }) {
        include 'windows/**'
        include 'linux/**'
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            forge_version          : project.forge_version,
            forge_version_range    : project.forge_version_range,
            loader_version_range   : project.loader_version_range,
            embeddium_version_range: project.embeddium_version_range,
            oculus_version_range   : project.oculus_version_range,
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_license            : project.mod_license,
            mod_version            : project.mod_version,
            mod_authors            : project.mod_authors,
            mod_description        : project.mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : project.mod_id,
                'Specification-Vendor'    : project.mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.mod_name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : project.mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'voxy.forge.mixins.json'
        ])
    }
}

jar.finalizedBy('reobfJar')
