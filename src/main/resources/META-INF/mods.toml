modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/matsuokajuri/voxy/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="assets/voxy/icon.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="voxy.forge.mixins.json"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="embeddium"
mandatory=true
versionRange="${embeddium_version_range}"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="oculus"
mandatory=false
versionRange="${oculus_version_range}"
ordering="AFTER"
side="CLIENT"

# Included in the release JAR, but another Maven identity may supply the selected Forge
# wrapper. Require the verified API minimum, not the bundled payload's version.
[[dependencies.${mod_id}]]
modId="mixinsquared"
mandatory=true
versionRange="${mixinsquared_version_range}"
ordering="NONE"
side="CLIENT"
